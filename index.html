<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0908" />
    <!--
      GitHub Pages не даёт задавать HTTP-заголовки, поэтому CSP объявлена метой —
      единственный доступный слой. Google Fonts вынесены в исключения явно,
      всё остальное — только со своего origin (HDRI грузится XHR'ом → connect-src).
      frame-ancestors в мете браузерами игнорируется, поэтому не указан.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>שחור · קפה בלי מיותר · יפו</title>
    <meta
      name="description"
      content="שחור — מיקרו־קלייה ובית קפה בסמטה ביפו. קולים ביום שלישי, תפריט קצר בכוונה. קונספט הדגמה."
    />
    <!--
      Шрифты лежат на своём домене (scripts/fetch_fonts.py) — сторонний CDN убран
      вместе с двумя коннектами на старте. Предзагружаем только то, что реально
      стоит на первом экране в локали по умолчанию: вордмарк, дисплей и корпус
      на иврите плюс моно для меток. Остальные подмножества браузер возьмёт сам
      по unicode-range, когда переключат язык.
    -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/cafe-shachor/fonts/suez-one-hebrew-400-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/cafe-shachor/fonts/frank-ruhl-hebrew-300-900-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/cafe-shachor/fonts/miriam-hebrew-400-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/cafe-shachor/fonts/plex-mono-latin-400-normal.woff2" />

        "@type": "CafeOrCoffeeShop",

        "priceRange": "₪₪",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "סמטת הבורסקי 6",

            "closes": "19:00"
          },
          { "@type": "OpeningHoursSpecification", "dayOfWeek": "Friday", "opens": "07:00", "closes": "15:00" }
        ],
        "disambiguatingDescription": "Demo concept. Address, phone and imagery are fictional."
      }

    <script type="module" crossorigin src="/cafe-shachor/assets/index-C4R-uPyr.js"></script>
