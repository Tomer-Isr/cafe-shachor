<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0908" />
    <!--
      GitHub Pages не даёт задавать HTTP-заголовки, поэтому CSP объявлена метой —
      единственный доступный слой. Google Fonts вынесены в исключения явно,
      всё остальное — только со своего origin (HDRI грузится XHR'ом → connect-src).
      frame-ancestors в мете браузерами игнорируется, поэтому не указан.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>שחור · קפה בלי מיותר · יפו</title>
    <meta
      name="description"
      content="שחור — מיקרו־קלייה ובית קפה בסמטה ביפו. קולים ביום שלישי, תפריט קצר בכוונה. קונספט הדגמה."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;500;800&family=Heebo:wght@200;400;500&family=Cormorant+Garamond:wght@300;500;600&family=Manrope:wght@200;400;500&display=swap"
      rel="stylesheet"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "CafeOrCoffeeShop",
        "name": "שחור",
        "servesCuisine": "Coffee",
        "priceRange": "₪₪",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "סמטת הבורסקי 6",
          "addressLocality": "יפו",
          "addressCountry": "IL"
        },
        "telephone": "+972-3-000-0000",
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday"],
            "opens": "07:00",
            "closes": "19:00"
          },
          { "@type": "OpeningHoursSpecification", "dayOfWeek": "Friday", "opens": "07:00", "closes": "15:00" }
        ],
        "disambiguatingDescription": "Demo concept. Address, phone and imagery are fictional."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript style="display:block;padding:2rem;font-family:sans-serif;color:#ece6dc">
      שחור · קפה בלי מיותר · יפו. א׳–ה׳ 07:00–19:00, ו׳ עד 15:00, שבת סגור.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
